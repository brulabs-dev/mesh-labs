<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesh Labs — Em manutenção</title>
<meta name="description" content="O Mesh Labs está em manutenção programada. Tente acessar de novo mais tarde.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fafaf7">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7;--surface:#fff;--surface-2:#f4f3ee;--line:#e5e3d8;
  --ink:#1a1a17;--ink-2:#3a3a35;--ink-3:#6b6b62;--ink-4:#9a998e;
  --accent:#e21a21;--accent-2:#f4a300;--warn:#f4a300;
  --shadow-md:0 4px 14px rgba(20,18,12,.06),0 1px 2px rgba(20,18,12,.04);
  --font:"Inter Tight",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f0f0d;--surface:#171714;--surface-2:#1d1d1a;--line:#2a2a26;
    --ink:#f0eee5;--ink-2:#cfcdc2;--ink-3:#9a988c;--ink-4:#6c6a60;
    --accent:#ff2a31;--shadow-md:0 4px 14px rgba(0,0,0,.5);
  }
  .logo-light{display:none}
  .logo-dark{display:block!important}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink-2);font:400 15px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden;
}
/* grade pontilhada de bancada, esmaecida nas bordas */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.5px) 0 0/20px 20px;
  -webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 0%,transparent 70%);
  mask-image:radial-gradient(ellipse at 30% 40%,#000 0%,transparent 70%);
}
header,main,footer{position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;padding-inline:32px}
header{padding-top:32px;display:flex;align-items:center;gap:12px}
header img{width:32px;height:32px;display:block}
.logo-dark{display:none}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
.brand span{color:var(--ink-3);font-weight:500}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:64px}
.status{
  align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
  padding:5px 12px 5px 10px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-md);
  font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h1{
  margin-top:24px;max-width:12ch;color:var(--ink);
  font-size:clamp(36px,6.4vw,64px);line-height:1.04;font-weight:600;letter-spacing:-.03em;
}
h1 em{font-style:normal;white-space:nowrap;color:var(--accent)}
.lead{margin-top:20px;max-width:46ch;font-size:clamp(15px,1.6vw,17px);color:var(--ink-3)}
.panel{
  margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:400px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-md);
}
.panel>div{padding:14px 16px;min-width:0}
.panel>div+div{border-left:1px solid var(--line)}
.k{font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.v{margin-top:8px;font:500 13px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.v i{font-style:normal;color:var(--warn)}
.waves{
  position:fixed;right:0;bottom:12vh;width:min(58vw,760px);opacity:.7;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%);
}
footer{padding-block:24px;font:500 11px/1.4 var(--mono);color:var(--ink-4);letter-spacing:.02em}
@media (max-width:640px){
  header,main,footer{padding-inline:16px}
  .panel{grid-template-columns:1fr}
  .panel>div+div{border-left:0;border-top:1px solid var(--line)}
  .waves{width:130vw;bottom:9vh;opacity:.45}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<header>
  <img class="logo-light" src="logo.png" alt="">
  <img class="logo-dark" src="logo-dark.png" alt="">
  <div class="brand">Mesh <span>Labs</span></div>
</header>

<main>
  <div class="status" role="status"><span class="dot"></span>Manutenção programada</div>
  <h1>Estamos em <em>manutenção</em>.</h1>
  <p class="lead">O Mesh Labs está fora do ar para manutenção programada. Tente acessar de novo mais tarde.</p>

  <div class="panel">
    <div><div class="k">Status</div><div class="v"><i>●</i> Em manutenção</div></div>
    <div><div class="k">Acesso</div><div class="v">Indisponível</div></div>
  </div>
</main>

</body>
</html>
